<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ته كه يف من دهيت؟ ؟</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f7f9fa;
            font-family: sans-serif;
            margin: 0;
            overflow: hidden;
            padding: 20px;
        }

        h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 40px;
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100px;
            position: relative;
        }

        button {
            padding: 14px 32px;
            font-size: 1.2rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            touch-action: manipulation;
        }

        #yesBtn {
            background-color: #ff4b5c;
            color: white;
            position: absolute;
            /* جێگیرکردنی دوگمەی بەڵێ لە لای چەپ */
            left: calc(50% - 110px); 
        }

        #noBtn {
            background-color: #333;
            color: white;
            position: absolute;
            /* جێگیرکردنی سەرەتایی دوگمەی نەخێر لە لای ڕاست */
            left: calc(50% + 10px);
            transition: all 0.1s ease;
        }
    </style>
</head>
<body>

    <h1>ته كه يف من دهيت؟🥺</h1>

    <div class="container">
        <button id="yesBtn" onclick="confettiBtn()">بەڵێ</button>
        <button id="noBtn">نەخێر</button>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');

        // فەنکشنێک بۆ گۆڕینی شوێنی دوگمەکە
        function moveButton() {
            // دیاریکردنی سنورەکان بۆ ئەوەی دوگمەکە زۆر نەچێتە قەراغی شاشەکە
            const padding = 30;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            // دروستکردنی شوێنی هەڕەمەکی لە نێوان سنورەکاندا
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        }

        // بۆ مۆبایل (کاتێک پەنجە بەر دوگمەکە دەکەوێت)
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // ڕێگری دەکات لە کلیک بوونی ئۆتۆماتیکی
            moveButton();
        });

        // بۆ کۆمپیوتەر (کاتێک ماوس دەچێتە سەر دوگمەکە)
        noBtn.addEventListener('mouseover', () => {
            moveButton();
        });

        function confettiBtn() {
            alert("توبو خو سفك دکەي بيژە نه! ");
        }
    </script>

</body>
</html>
